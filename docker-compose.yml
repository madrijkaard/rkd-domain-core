services:
  postgres:
    image: postgres:16-alpine
    container_name: rkd-domain-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: domain_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - domain-core-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domain_core"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  domain-core-postgres-data:
